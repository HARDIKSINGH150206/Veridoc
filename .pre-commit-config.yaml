# Runs on every commit. Install once with: uv run pre-commit install
# Keep the ruff rev equal to the ruff version locked in uv.lock.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: check-hardcoding
        name: no hardcoding (paths, localhost, sample data, stubs)
        entry: python scripts/check_hardcoding.py
        language: python
        pass_filenames: false
        types_or: [python, javascript, html, css]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
