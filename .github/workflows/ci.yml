# Required checks on pull requests into dev and main (see docs/GIT_WORKFLOW.md section 7).
# The job names "checks" and "secrets" are the required status check names.
name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.2

      - name: Install dependencies (lockfile must be up to date)
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy .

      - name: Pytest (exit code 5, no tests collected, counts as a pass)
        shell: bash
        run: |
          set +e
          uv run pytest -q
          code=$?
          if [ "$code" -eq 5 ]; then
            echo "No tests collected: counted as a pass."
            exit 0
          fi
          exit "$code"

      - name: Folder check
        run: uv run python scripts/check_folder_tree.py

      - name: Hardcoding check
        run: uv run python scripts/check_hardcoding.py

      - name: Design token check
        run: uv run python scripts/check_design_tokens.py

      - name: Test vectors are up to date (generated by the real code)
        run: uv run python scripts/make_test_vectors.py --check

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/verify/package-lock.json

      - name: JavaScript integrity primitives reproduce every test vector
        working-directory: apps/verify
        run: |
          npm ci
          npm test

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
